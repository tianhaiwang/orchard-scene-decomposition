[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchard-scene-decomposition"
version = "0.8.6"
description = "Interactive geometric decomposition of reconstructed orchard Gaussian scenes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.3",
    "scipy==1.16.2",
    "scikit-learn==1.7.2",
    "open3d==0.19.0",
    "plyfile==1.1.2",
    "pwlf==2.5.2",
]

[project.optional-dependencies]
csf = ["cloth-simulation-filter==1.1.7"]
gui = ["PyQt5>=5.15,<6"]

[project.scripts]
orchard-scene-decomposition = "orchard_scene_decomposition.cli:main"
orchard-scene-decomposition-worker = "orchard_scene_decomposition.worker:main"
orchard-scene-decomposition-gui = "orchard_scene_decomposition.ui.workbench:main"
orchard-scene-decomposition-viewer = "orchard_scene_decomposition.ui.viewer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orchard_scene_decomposition*"]
